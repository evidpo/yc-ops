[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yc-ops"
version = "0.1.0"
description = "CLI for managing Yandex Cloud resources (VMs, databases, storage)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "evidpo" }]
keywords = ["yandex-cloud", "cli", "devops", "infrastructure"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "typer>=0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
yc-ops = "yc_ops.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/yc_ops"]

[tool.ruff]
target-version = "py310"
line-length = 100
